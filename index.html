<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Food Track</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Food Track" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Lobster&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Lobster', 'cursive'],
            },
            colors: {
              brand: {
                bg: '#FFFFFF',
                text: '#262626',
                muted: '#8E8E8E',
                border: '#DBDBDB',
                card: '#FFFFFF',
                orange: '#FF512F',
                pink: '#DD2476',
                green: '#009966',
                blue: '#0095F6',
                red: '#ED4956',
              }
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(to right, #FF512F, #DD2476)',
              'brand-gradient-vertical': 'linear-gradient(to bottom, #FF512F, #DD2476)',
            },
            animation: {
              'zoom-in': 'zoomIn 2.5s ease-out forwards',
              'fade-out': 'fadeOut 0.5s ease-in forwards 2s',
              'slide-up': 'slideUp 0.5s ease-out forwards',
            },
            keyframes: {
              zoomIn: {
                '0%': { transform: 'scale(1) opacity(0)' },
                '20%': { transform: 'scale(1.2) opacity(1)' },
                '100%': { transform: 'scale(4) opacity(0)' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0', visibility: 'hidden' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      html, body {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body class="bg-brand-bg text-brand-text selection:bg-brand-pink selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
